<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music — ART AGAINST THE MACHINE</title>
    <link rel="stylesheet" href="css/music_style.css">
</head>
<body class="music_page">

    <!-- 2:3 Main Artboard Frame -->
    <div class="page_container">

        <!-- =================================================================
             1. TOP "MUSIC" TITLE PNG HEADER
             ================================================================= -->
        <header class="music_header">
            <img src="images/music_title.png" alt="MUSIC" class="music_title_img">
        </header>

        <!-- =================================================================
             2. TRACK LIST AREA (Your PNG is the entire full-width button)
             ================================================================= -->
        <main class="music_feed">

            <!-- Track 1: Whole Button PNG Opens YouTube Link -->
            <a href="https://open.spotify.com/album/5q8dbnQLIz8F9cDfQxb7F6?si=jrkogZq_ScGhJVWoxB8D6A&nd=1&dlsi=ad4c0e278f6e4411"
               target="_blank"
               rel="noopener noreferrer"
               class="track_btn"
               aria-label="Play Track on YouTube">
                <img src="images/music_button.png" alt="Play Track" class="track_btn_img">
            </a>

            <!-- TEMPLATE FOR MORE TRACK BUTTONS (Copy & paste below to add more) -->
            <!--
            <a href="https://www.youtube.com/watch?v=VIDEO_ID"
               target="_blank"
               rel="noopener noreferrer"
               class="track_btn"
               aria-label="Play Track 2 on YouTube">
                <img src="images/play_button_2.png" alt="Play Track 2" class="track_btn_img">
            </a>
            -->

        </main>

        <!-- =================================================================
             3. BOTTOM CORNER NAVIGATION BUTTONS (PHOTOGRAPHY & WRITING)
             ================================================================= -->
        <nav class="corner_nav">
            <a href="photography.html" class="nav_btn btn_left" aria-label="Go to Photography page">
                <img src="images/P1BUTTONPHOTOGRAPHY.png" alt="Photography">
            </a>

            <a href="writing.html" class="nav_btn btn_right" aria-label="Go to Writing page">
                <img src="images/P1BUTTON-WRITING.png" alt="Writing">
            </a>
        </nav>

    </div>

</body>
</html>
